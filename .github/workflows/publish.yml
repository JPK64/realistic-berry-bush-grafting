name: Publish Mod to Vintage Story Mod DB

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert DESCRIPTION.md to DESCRIPTION.html
        uses: ./.github/actions/markdown-to-html
        with:
          markdown-file: DESCRIPTION.md
          html-file: DESCRIPTION.html

      - name: Publish DESCRIPTION.html
        uses: actions/upload-artifact@v4
        with:
          name: description
          path: DESCRIPTION.html

      - name: Write Changelog to CHANGELOG.md
        env:
          MARKDOWN: ${{ github.event.release.body }}
        run: cat > CHANGELOG.md <<< "$MARKDOWN"

      - name: Convert CHANGELOG.md to CHANGELOG.html
        uses: ./.github/actions/markdown-to-html
        with:
          markdown-file: CHANGELOG.md
          html-file: CHANGELOG.html

      - name: Publish CHANGELOG.html
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.html

      # In the future, the artifact publishing above might be replaced with a proper upload to the Vintage Story Mod DB
      # JSON API prepared in the steps below. However, this requires https://github.com/anegostudios/vsmoddb/issues/18
      # to be implemented.

