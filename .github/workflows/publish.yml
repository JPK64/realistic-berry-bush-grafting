name: Publish Mod to Vintage Story Mod DB

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert DESCRIPTION.md to DESCRIPTION.html
        uses: ./.github/actions/markdown-to-html
        with:
          markdown-file: DESCRIPTION.md
          html-file: DESCRIPTION.html

      - name: Write Changelog to CHANGELOG.md
        env:
          MARKDOWN: ${{ github.event.release.body }}
        run: cat > CHANGELOG.md <<< "$MARKDOWN"

      - name: Convert CHANGELOG.md to CHANGELOG.html
        uses: ./.github/actions/markdown-to-html
        with:
          markdown-file: CHANGELOG.md
          html-file: CHANGELOG.html

      - name: Download Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          curl -L
          -H "Authorization: Bearer $TOKEN"
          -H "Accept: application/octet-stream"
          "${{ github.event.release.assets[0].url }}"
          -o rbbg-${{ github.event.release.tag_name }}.zip


      # In the future, the artifact publishing might be replaced with a proper upload to the Vintage Story Mod DB JSON
      # API prepared below. However, this requires https://github.com/anegostudios/vsmoddb/issues/18 to be implemented.
      - name: Publish Release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            DESCRIPTION.html
            CHANGELOG.html
            rbbg-${{ github.event.release.tag_name }}.zip
