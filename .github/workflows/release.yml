name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
        
      - name: Generate Recipe Files
        run: python scripts/generate.py

      - name: Package Mod
        run: >-
          zip -r rbbg-${{ github.ref_name }}.zip
            assets
            modinfo.json
            LICENSE.md
            NOTICE.md

      - name: Draft Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}: "
          files: rbbg-${{ github.ref_name }}.zip
          draft: true
