name: Convert Markdown to HTML

inputs:
  markdown-file:
    description: Path to the markdown file to convert
    required: true
  html-file:
    description: Path to the file to write the HTML output to
    required: true

runs:
  using: composite
  steps:
    - name: Convert Markdown to HTML
      shell: bash
      env:
        TOKEN: ${{ github.token }}
      run: >
        cat ${{ inputs.markdown-file }} |
        jq -Rs '{text: ., mode: "gfm", context: "${{ github.repository }}"}' |
        curl -X POST
          -H "Authorization: Bearer $GITHUB_TOKEN"
          -H "Accept: text/html"
          -H "Content-Type: application/json"
          "https://api.github.com/markdown"
          --data-binary @-
          -d "$()"
          -o ${{ inputs.html-file }}